name: CD - Deploy da API no ECS

# Dispara depois que o CI conclui na main e só faz deploy se o CI passou.
# Também pode ser rodado manualmente pela aba Actions (workflow_dispatch).
on:
  workflow_run:
    workflows: ["CI - MLOPS"]        # precisa bater com o `name:` do ci.yml
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: triagem-app
  ECS_CLUSTER: default
  ECS_SERVICE: triagem-app
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: Main               # nome do container na task definition (case-sensitive)

jobs:
  deploy:
    name: Build (ECR) e deploy (ECS Fargate)
    runs-on: ubuntu-latest
    environment: production
    # roda em dispatch manual OU quando o CI concluiu com sucesso
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout do commit que passou no CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configurar credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem para o ECR
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Injetar a nova imagem na task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy no ECS (registra revisão + update do service)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # Opcional: cadastre a variável de repositório API_URL (DNS do ALB, sem barra final)
      - name: Smoke test do endpoint
        if: vars.API_URL != ''
        run: |
          curl -fsS "${{ vars.API_URL }}/health"
          curl -fsS -X POST "${{ vars.API_URL }}/predict" \
            -H 'Content-Type: application/json' \
            -d '{"texto":"Patient with acute chest pain and elevated troponin on ECG."}'
