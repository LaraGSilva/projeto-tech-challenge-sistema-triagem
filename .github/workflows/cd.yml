name: CD - Build and push image

on:
    push:
        branches:
            - main

env:
    REGISTRY: ghcr.io #github container registry
    IMAGE_NAME: laragsilva/projeto-tech-challenge-sistema-triagem

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write
            id_token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Login github container registry
              uses: docker/login-action@v4
              with:
                registry: ${{ env.REGISTRY }}  
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}  
            
            - name: Build and Push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: |
                    ${{ env.REGISTRY }}/${{env.IMAGE_NAME}}:${{github.sha}}
            
            
            - name: Configure AWS Crendentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v6.1.0
              with:
                audience: sts.amazonaws.com.cn
                aws-region: us-east-1
                role-to-assume: arn:aws:iam:: #adicionar o arn da role

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aes-credentials@v6.1.0
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-east-1

            - name: Validar identdade (AWS <> OIDC)
              run: |
                echo "Testando conexão com a AWS .."
                aws sts get-caller-identity


