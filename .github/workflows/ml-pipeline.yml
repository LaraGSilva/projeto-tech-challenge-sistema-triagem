name: Pipeline de treinamento ML

# Dispara ao dar push na main que altere o código do modelo, os dados ou as deps.
on:
  push:
    branches:
      - main
    paths:
      - 'src/model/**'
      - 'src/data/**'
      - 'src/pipeline.py'
      - 'config/config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

env:
  UV_FROZEN: "true"
  PYTHON_VERSION: "3.11"

jobs:
  preparar-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      # Os CSVs brutos são versionados via DVC — precisa de um remote acessível.
      # Configure o secret DVC_REMOTE_URL (e credenciais do backend) no repositório.
      - name: Baixar dados (dvc pull)
        run: uv run dvc pull --force

      - name: ETL - preparar dataset
        run: |
          uv run python -c "from src.model.preprocessing import build_dataset; \
          build_dataset(save_to='artifacts/dataset_processado.csv')"

      - name: Salvar dataset como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: artifacts/dataset_processado.csv
          retention-days: 5

  treinamento:
    needs: preparar-dados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      - name: Download do dataset
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: artifacts

      - name: Treinar e avaliar modelo
        run: |
          uv run python -c "from src.model.train import run_training; \
          from src.model.evaluate import run_evaluation; \
          run_training('artifacts/dataset_processado.csv'); run_evaluation()"

      - name: Salvar modelo como artefato
        uses: actions/upload-artifact@v4
        with:
          name: modelo-treinado
          path: |
            models/classifier.pkl
            models/metadata.json
            models/evaluation.json
          retention-days: 30
