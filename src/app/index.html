<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Triagem Automática de Laudos Médicos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fff9c4;            /* amarelo claro */
      color: #1a1a1a;
      line-height: 1.5;
    }
    header {
      background: #000;               /* header preto */
      color: #fff;
      padding: 20px 24px;
    }
    header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; }
    main { max-width: 760px; margin: 0 auto; padding: 28px 24px 56px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea {
      width: 100%; min-height: 150px; padding: 12px; font-size: 1rem;
      font-family: inherit; background: #fffef7;
      border: 2px solid #000; border-radius: 8px; resize: vertical;
    }
    button {
      margin-top: 14px; padding: 11px 24px; font-size: 1rem; font-weight: 700;
      color: #fff; background: #000; border: none; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: progress; }
    #resultado {
      margin-top: 26px; padding: 18px 20px; min-height: 56px;
      background: #fffef7; border: 2px solid #000; border-radius: 10px;
    }
    #resultado.vazio { color: #666; font-style: italic; }
    .classe { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; }
    .meta { color: #444; font-size: .92rem; margin: 0 0 14px; }
    .barra-linha { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: .9rem; }
    .barra-nome { flex: 0 0 190px; }
    .barra-track { flex: 1; height: 14px; background: #eee; border: 1px solid #000; border-radius: 4px; overflow: hidden; }
    .barra-fill { height: 100%; background: #000; }
    .barra-pct { flex: 0 0 54px; text-align: right; font-variant-numeric: tabular-nums; }
    .erro { color: #b00020; font-weight: 600; }
    @media (max-width: 520px) { .barra-nome { flex-basis: 130px; } }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de Triagem Automática de Laudos Médicos</h1>
  </header>

  <main>
    <label for="laudo">Digite o texto descritivo do laudo médico:</label>
    <textarea id="laudo" placeholder="Ex.: Patient presents with acute chest pain, elevated troponin and ST-segment elevation on ECG consistent with myocardial infarction."></textarea>
    <button id="enviar" type="button">Classificar</button>

    <div id="resultado" class="vazio">O resultado da classificação aparecerá aqui.</div>
  </main>

  <script>
    const btn = document.getElementById("enviar");
    const txt = document.getElementById("laudo");
    const box = document.getElementById("resultado");

    // Vazio = mesma origem (quando a página é servida pela própria API).
    // Para abrir o HTML sozinho, use  ?api=https://SEU-ENDPOINT  na URL.
    const API_BASE = (new URLSearchParams(location.search).get("api") || "").replace(/\/$/, "");

    btn.addEventListener("click", classificar);
    txt.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") classificar();
    });

    async function classificar() {
      const texto = txt.value.trim();
      if (!texto) {
        mostrarErro("Digite o texto do laudo antes de classificar.");
        return;
      }
      btn.disabled = true;
      box.className = "";
      box.textContent = "Classificando...";
      try {
        const resp = await fetch(API_BASE + "/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          mostrarErro(data.detail || ("Erro " + resp.status));
          return;
        }
        mostrarResultado(data);
      } catch (err) {
        mostrarErro("Falha na conexão com a API: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function mostrarErro(msg) {
      box.className = "";
      box.innerHTML = '<span class="erro">' + escapeHtml(msg) + "</span>";
    }

    function mostrarResultado(d) {
      box.className = "";
      const conf = (d.confianca * 100).toFixed(1);
      const probs = Object.entries(d.probabilidades).sort((a, b) => b[1] - a[1]);
      let html = "";
      html += '<p class="classe">' + escapeHtml(d.condition_name) + "</p>";
      html +=
        '<p class="meta">classe ' + d.condition_label +
        " &middot; confiança " + conf + "%" +
        " &middot; inferência " + d.inference_time_ms + " ms</p>";
      for (const [nome, p] of probs) {
        const pct = (p * 100).toFixed(1);
        html +=
          '<div class="barra-linha">' +
          '<span class="barra-nome">' + escapeHtml(nome) + "</span>" +
          '<span class="barra-track"><span class="barra-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="barra-pct">' + pct + "%</span>" +
          "</div>";
      }
      box.innerHTML = html;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }
  </script>
</body>
</html>
